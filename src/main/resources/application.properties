spring.application.name=spring-gift
# h2-console
spring.h2.console.enabled=true
# db url
spring.datasource.url=jdbc:h2:mem:test;MODE=MYSQL;DB_CLOSE_DELAY=-1
# jwt secret key
jwt.secret=${JWT_SECRET}
# jpa
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
# kakao oauth
kakao.client-id=${CLIENT_ID}
kakao.redirect-uri=http://localhost:8080/api/oauth
kakao.request-token-uri=https://kauth.kakao.com/oauth/token
kakao.request-user-info-uri=https://kapi.kakao.com/v2/user/me
kakao.kakao-authorize-uri=https://kauth.kakao.com/oauth/authorize
kakao.request-message-to-me-uri=https://kapi.kakao.com/v2/api/talk/memo/send